# ─────────────────────────────────────────────────────────
# NOUS LAND — Hyprland Keybinds
# Super = Windows/Command key
# Shared keybind philosophy with Niri config
# ─────────────────────────────────────────────────────────

$mainMod = SUPER

# ── Terminal & App Launchers ───────────────────────
bind = $mainMod, Q, exec, kitty
bind = $mainMod, Space, exec, wofi --show drun
bind = $mainMod SHIFT, Space, exec, wofi --show run

# ── AI Agent (Hermes) ──────────────────────────────
bind = $mainMod, A, exec, python3 ~/.config/nous-agent/ui.py

# ── Kill active window ──────────────────────────────
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, C, forcekillactive,

# ── Exit Hyprland ───────────────────────────────────
bind = $mainMod SHIFT, Q, exit,

# ── Reload Hyprland config ─────────────────────────
bind = $mainMod SHIFT, R, reloadconfig,

# ── Toggle fullscreen ───────────────────────────────
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, F, togglefullscreen,

# ── Toggle floating mode ────────────────────────────
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, V, setfloating, # force float

# ── Move focus ──────────────────────────────────────
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ── Switch workspaces ───────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── Move window to workspace ────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Move focus to special workspace ─────────────────
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ── Resize windows ──────────────────────────────────
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# ── Move windows (swap) ────────────────────────────
bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r
bind = $mainMod ALT, up, swapwindow, u
bind = $mainMod ALT, down, swapwindow, d

# ── Toggle split ────────────────────────────────────
bind = $mainMod, T, togglesplit,

# ── Layout controls ─────────────────────────────────
bind = $mainMod, P, pseudo, # pseudotile toggle
bind = $mainMod SHIFT, P, togglepseudo, # toggle pseudotile

# ── Gaps control ────────────────────────────────────
bind = $mainMod, G, togglegaps, # toggle gaps on/off
bind = $mainMod SHIFT, G, setgaps, 0 # reset gaps

# ── Screenshot tools ────────────────────────────────
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bind = SHIFT, Print, exec, grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# ── Color picker ─────────────────────────────────────
bind = $mainMod, X, exec, hyprpicker

# ── Volume controls ─────────────────────────────────
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

# ── Brightness controls ─────────────────────────────
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Media controls ──────────────────────────────────
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ── Lock screen ─────────────────────────────────────
bind = $mainMod SHIFT, L, exec, hyprlock

# ── Theme switching ──────────────────────────────────
bind = $mainMod, T, exec, bash ~/.local/bin/theme-switcher-gui.sh

# ── Reload theme (hot-reload) ──────────────────────
bind = $mainMod SHIFT, T, exec, bash ~/.local/bin/hot-reload.sh
