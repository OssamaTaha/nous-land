# ─────────────────────────────────────────────────────────
# NOUS LAND — Hyprland Configuration
# Author: Nous Land
# Description: Smooth animations, smart gaps, master layout
# ─────────────────────────────────────────────────────────

# Source modular configs
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/monitors.conf

# ── Theme Integration ────────────────────────────────
# Colors are loaded from the active theme via theme-switcher.sh
# This file reads from /tmp/nous-current-theme/hyprland-colors.conf
$THEME_DIR = /tmp/nous-current-theme
source = $THEME_DIR/hyprland-colors.conf

# ── Monitor Configuration ───────────────────────────
monitor=,preferred,auto,1

# ── Execute on launch ────────────────────────────────
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = mako
exec-once = /home/$USER/.local/bin/nous-theme-watcher &

# ── Input Configuration ─────────────────────────────
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
    mouse {
        accel_profile = flat
    }
}

# ── General Settings ────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 8
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
    snap {
        window_edge = true
        monitor_edge = true
    }
}

# ── Decoration ──────────────────────────────────────
decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.9
    dim_around = $dim_strength
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = $shadow_range
        render_power = $shadow_render_power
        color = $shadow
    }
}

# ── Animations ───────────────────────────────────────
animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# ── Dwindle Layout ──────────────────────────────────
dwindle {
    pseudotile = yes
    preserve_split = yes
    smart_split = true
    smart_resizing = true
    force_split = 2
}

# ── Misc ────────────────────────────────────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = false
    key_press_enables_dpms = false
    layers_hog_keyboard_focus = false
    exit_on_lock = true
}

# ── XDPW (for screen sharing) ──────────────────────
windowrulev2 = float, class:^(xdg-desktop-portal-hyprland)$
windowrulev2 = nofocus, class:^(xdg-desktop-portal-hyprland)$
