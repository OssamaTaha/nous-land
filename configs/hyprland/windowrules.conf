# ─────────────────────────────────────────────────────────
# NOUS LAND — Hyprland Window Rules
# ─────────────────────────────────────────────────────────

# ── Floating windows ────────────────────────────────
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(galculator)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, class:^(yad)$
windowrulev2 = float, class:^(nwg-look)$

# ── No border on fullscreen ─────────────────────────
windowrulev2 = noborder, fullscreen:1

# ── Set workspace on launch ─────────────────────────
windowrulev2 = workspace 1, class:^(firefox)$
windowrulev2 = workspace 2, class:^(code-oss)$
windowrulev2 = workspace 2, class:^(code)$
windowrulev2 = workspace 2, class:^(codium)$
windowrulev2 = workspace 3, class:^(kitty)$
windowrulev2 = workspace 10, class:^(discord)$
windowrulev2 = workspace 10, class:^(telegram-desktop)$

# ── Always on top ───────────────────────────────────
windowrulev2 = alwaysontop, class:^(swaync-notification-window)$

# ── Special workspace (scratchpad) ─────────────────
windowrulev2 = workspace special:magic, class:^(kitty)$, title:^(.*scratchpad.*)$

# ── Transparency ─────────────────────────────────────
windowrulev2 = opacity 0.9 0.9, class:^(kitty)$
windowrulev2 = opacity 0.95 0.95, class:^(.*)$

# ── Size for floating windows ───────────────────────
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = size 600 400, class:^(blueman-manager)$
