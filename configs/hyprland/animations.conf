# ─────────────────────────────────────────────────────────
# NOUS LAND — Hyprland Animations
# Smooth, snappy animations inspired by macOS/iOS
# ─────────────────────────────────────────────────────────

animations {
    enabled = yes
    
    # Cubic bezier curves for natural motion
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = easeOut, 0.16, 1.0, 0.3, 1.0
    bezier = easeIn, 0.4, 0.0, 1.0, 1.0
    bezier = easeInOut, 0.65, 0.0, 0.35, 1.0
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = bounce, 0.34, 1.56, 0.64, 1.0
    
    # Window open/close animations
    animation = windows, 1, 4, easeOut
    animation = windowsOut, 1, 3, easeIn, popin 80%
    
    # Border animations
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    
    # Fade in/out
    animation = fade, 1, 3, easeOut
    animation = fadeOut, 1, 3, easeIn
    
    # Workspace switches
    animation = workspaces, 1, 5, easeOut
    
    # Layer animations (bars, notifications)
    animation = layers, 1, 3, easeOut
    animation = layersOut, 1, 3, easeIn
}
